name: Release

# Push a tag like v0.2.0 (matching packages/*/package.json versions) to publish
# truecanvas and create-truecanvas to npm. Publishing uses npm trusted
# publishing (OIDC): no token, and provenance is attached automatically.
# Versions already on npm are skipped, so re-running a release is safe.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5+
      - run: pnpm install --frozen-lockfile
      - name: Versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/truecanvas packages/create-truecanvas; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, tag is $tag"; exit 1; }
          done
      - run: pnpm build
      - run: pnpm test
      - name: Publish to npm
        run: |
          for p in packages/truecanvas packages/create-truecanvas; do
            name=$(node -p "require('./$p/package.json').name")
            version=$(node -p "require('./$p/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
            else
              (cd "$p" && npm publish --access public)
            fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
